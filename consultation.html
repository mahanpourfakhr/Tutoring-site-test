<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Request a free consultation for college admissions advising, graduate school guidance, or one-on-one STEM tutoring.">
  <link rel="canonical" href="https://tutoring-room.com/consultation.html">
  <link rel="stylesheet" href="style.css?v=site-refresh-20261027">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">
    <span class="logo-text">THE TUTORING ROOM</span>
    <span class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0.75" y="0.75" width="22.5" height="22.5" stroke="currentColor" stroke-width="1.25"/>
        <circle cx="9.5" cy="12" r="3.25" stroke="currentColor" stroke-width="1.25"/>
        <path d="M12.75 12H20M18 12V14.5M20 12V14" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
        </svg>
    </span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-navigation">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-group" id="site-navigation">
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="team.html">Our Team</a>
        <a href="blog.html">Blog</a>
      </nav>
      <a href="consultation.html" class="btn-consultation nav-active-consultation">Free Consultation</a>
      <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main>
    <section class="contact">
      <h1 class="section-heading">Book a Free Consultation</h1>
      <p class="contact-sub">Tell us what you’re working toward. We’ll follow up to learn more and recommend next steps.</p>

      <form id="consultation-form" action="https://formspree.io/f/xdardaqd" method="POST" class="contact-form">
        <input type="hidden" name="subject" value="New consultation request — The Tutoring Room">

        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone number (optional)</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel">
        </div>

        <div class="form-group">
          <label for="service">What are you interested in?</label>
          <select id="service" name="service" required>
            <option value="" disabled selected>Select a service</option>
            <option value="college-advising">College Admissions Advising</option>
            <option value="grad-advising">Graduate School Advising</option>
            <option value="stem-tutoring">STEM Tutoring</option>
            <option value="unsure">Not sure yet</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Tell us a bit about your situation</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        <button type="submit" class="btn-primary">Send my request</button>
      </form>
    </section>

  </main>


  

  <footer class="site-footer">

      <a href="index.html">Home</a>

      <a href="team.html">Our Team</a>
      <a href="blog.html">Blog</a>
      <a href="consultation.html">Free Consultation</a>
    </div>
  </footer>

  <script src="script.js?v=site-refresh-20261027"></script>
</body>
</html>
